[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logi-ghub-linux"
version = "0.1.0"
description = "Configure Logitech G mice and keyboards on Linux: DPI, buttons, macros, lighting and on-board profiles"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The GUI needs PyGObject with GTK 4 and libadwaita (Ubuntu: python3-gi gir1.2-adw-1).
gui = []
test = ["pytest"]

[project.scripts]
logi-ghub-cli = "logi_ghub.cli:main"
logi-ghubd = "logi_ghub.daemon:main"

[project.gui-scripts]
logi-ghub = "logi_ghub.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logi_ghub = ["hidpp/*.json", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
